<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | One Wish Willow</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="login">
  <header class="site-header">
    <a href="index.html" class="logo-link" aria-label="One Wish Willow home">
      <img src="assets/headertext.png" alt="One Wish Willow" />
    </a>
    <a class="top-buy" href="index.html">Home</a>
  </header>

  <main class="checkout-shell">
    <section class="status-panel login-panel">
      <h1>Admin Login</h1>
      <p>Enter the shop password to review, approve, reject, or ship orders.</p>
      <p class="warning" data-login-error hidden>Wrong password. Try again.</p>
      <form class="status-form" method="post" action="/api/admin/login">
        <input type="hidden" name="next" value="/admin.html" data-login-next />
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="buy-button" type="submit">Enter Admin</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms</a>
    <a href="status.html">Check Status</a>
    <a href="contact.html">Contact</a>
    <a href="disclaimer.html">Disclaimer</a>
  </footer>

  <script src="script.js?v=launch1"></script>
</body>
</html>
